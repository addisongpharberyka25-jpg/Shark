name: Build Shark APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install NDK (using preinstalled SDK)
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          ls "$ANDROID_HOME" || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358" || true
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> $GITHUB_ENV
          ls "$ANDROID_HOME/ndk" || true

      - name: Fix cargo linker
        run: |
          NDK="$ANDROID_HOME/ndk/28.2.13676358"
          CFG=exploit/rust-kplant/.cargo/config.toml
          sed -i "s#^linker = .*#linker = \"$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android31-clang\"#" "$CFG"
          cat "$CFG"

      - name: Build kplant (k61258)
        run: |
          cd exploit/rust-kplant
          CARGO_TARGET_DIR=target/k61258 cargo build --release --target aarch64-linux-android --no-default-features --features k61258
          cp target/k61258/aarch64-linux-android/release/kplant ../../app/app/src/main/jniLibs/arm64-v8a/libk61258.so
          chmod 755 ../../app/app/src/main/jniLibs/arm64-v8a/libk61258.so

      - name: Build APK
        run: |
          cd app
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shark-apk
          path: app/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
